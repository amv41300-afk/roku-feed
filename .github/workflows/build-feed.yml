name: Build Roku feed

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    paths:
      - pages.json
      - feed_server.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed
        run: python feed_server.py build --config pages.json > new.json

      - name: Keep the old feed if nothing was found
        run: |
          python -c "import json,sys; sys.exit(0 if json.load(open('new.json'))['rows'] else 1)" \
            && mv new.json data.json \
            || { echo 'No items found - keeping the previous data.json'; rm new.json; }

      - name: Commit data.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Feed unchanged."
          else
            git commit -m "Update Roku feed"
            git push
          fi
